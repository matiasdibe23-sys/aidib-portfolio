<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIDIB — Matías Di Benedetto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
    }
    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #F8FAFC;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #94A3B8;
      font-size: 1rem;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1E293B;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      color: #3B82F6;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #10B981;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="logo">AIDIB</div>
  <p class="subtitle">AI & Automation Developer Portfolio — Building production agents, data pipelines, and workflow automation.</p>
  <div class="status-badge">
    <span class="dot"></span> Empty but live milestone
  </div>
</body>
</html>
